<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenium Forms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Selenium Forms</h1>
    <form action="server.html">
        <input type="text" placeholder="First Name..." name="first" id="in_first">
        <br>
        <input type="text" placeholder="Last Name..." name="last" id="in_last">
        <br>
        <input type="email" placeholder="Email..." name="email" id="in_email">
        <br>
        <input type="submit"  id="in_submit_1">
    </form>

    <form action="server.html">
        <label for="">Select Country</label>
        <br>
        <select name="country" id="in_country">
            <option value="">--------------------</option>
            <option value="il">Israel</option>
            <option value="us">USA</option>
            <option value="br">Brazil</option>
            <option value="gr">Greece</option>
        </select>
        <br>
        <input type="submit" id="in_submit_2">
    </form>
</body>
</html>
